<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abyss</title>
<style>html,body{margin:0;height:100%;background:#020104}
#b{position:fixed;inset:0;display:grid;place-items:center;font:300 13px/1 sans-serif;letter-spacing:.5em;color:rgba(255,255,255,.5)}
#b i{display:block;width:44px;height:44px;margin:0 auto 18px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:#b46bff;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div id="b"><div><i></i>ABYSS</div></div>
<script>
/* Abyss for phones: always runs the newest player.
   The page is kept in IndexedDB (no 5 MB limit like localStorage). On launch we ask GitHub
   for the newest version number; if it's newer we show "Updating" and download it first. */
(async()=>{
  const FEED='https://raw.githubusercontent.com/slayerischillin/abyss/main';
  const ver=h=>{const m=/name="abyss-version" content="([\d.]+)"/.exec(h||'');return m?+m[1]:0};
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('abyss',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const iget=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||'');q.onerror=()=>r('')})}catch(e){return ''}};
  const iput=async(k,v)=>{try{const d=await idb();await new Promise((r,j)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=()=>j(t.error)})}catch(e){}};
  let ls='';try{ls=localStorage.getItem('abyss.page')||''}catch(e){}
  const saved=await iget('page');
  let bundled='';try{bundled=await (await fetch('abyss.html')).text()}catch(e){}
  let page=[saved,ls,bundled].reduce((a,b)=>ver(b)>ver(a)?b:a,'');
  try{localStorage.removeItem('abyss.page')}catch(e){}if(ver(page)>ver(saved))iput('page',page);
  const B=document.getElementById('b');
  try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),4000);
    const v=+(await (await fetch(FEED+'/version.json?t='+Date.now(),{cache:'no-store',signal:ctl.signal})).json()).version;
    if(v>ver(page)){B.innerHTML='<div><i></i>UPDATING</div>';
      const c2=new AbortController();setTimeout(()=>c2.abort(),25000);
      const h=await (await fetch(FEED+'/index.html?t='+Date.now(),{cache:'no-store',signal:c2.signal})).text();
      if(ver(h)===v&&h.includes('<title>')){page=h;await iput('page',h)}}
  }catch(e){}
  if(!page){B.textContent='Could not start Abyss';return}
  document.open();document.write(page);document.close();
})();
</script></body></html>
