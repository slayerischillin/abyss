name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor with iOS
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/ios@^6.2.0

      - name: Create the iOS project
        working-directory: mobile
        run: |
          cp ../index.html www/abyss.html
          npx cap add ios
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Abyss" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Abyss" "$PLIST"
          # Tell iOS this is a music app, so sound keeps playing on the home screen and with the screen locked
          AD=ios/App/App/AppDelegate.swift
          perl -0pi -e 's/import UIKit/import UIKit\nimport AVFoundation/' "$AD"
          perl -0pi -e 's/(didFinishLaunchingWithOptions[^{]*\{)/$1\n        try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [])\n        try? AVAudioSession.sharedInstance().setActive(true)/' "$AD"
          grep -n "AVAudioSession" "$AD"
          # Abyss icon instead of the default one
          ICONS=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONS"/*.png; do cp assets/ios-icon-1024.png "$f"; done
          ls "$ICONS"

      - name: Build (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "App.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/Abyss.app
          zip -qry Abyss.ipa Payload
          ls -la Abyss.ipa

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios
          name: Abyss for iPhone (unsigned)
          body: |
            Unsigned Abyss.ipa. It must be signed when installed, for example with Sideloadly or AltStore.
          files: Abyss.ipa
          make_latest: false
